[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouter"
version = "0.1.0"
description = "OpenAI-compatible multi-provider LLM gateway with complexity-aware routing"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.10.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "sqlalchemy[asyncio]==2.1.6",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "openai==2.54.0",
    "types-PyYAML==6.0.12.20261030",
    "fakeredis[lua]==2.40.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"app/providers/errors.py" = ["N818"]
