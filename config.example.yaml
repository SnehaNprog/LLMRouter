# Copy to config.yaml. API keys are never written here; reference environment variables instead.
models:
  # Several entries with the same name form one alias; traffic is split by weight.
  - name: fast
    provider: openai_compatible
    model: llama-3.1-8b-instant
    base_url: https://api.groq.com/openai/v1
    api_key: os.environ/GROQ_API_KEY
    weight: 1
    rpm: 30
    context_window: 131072  # tokens; take this from the model's docs
    # USD per million tokens. Illustrative numbers: use your vendor's current price list.
    input_cost_per_mtok: 0.05
    output_cost_per_mtok: 0.08

  - name: smart
    provider: anthropic
    model: claude-sonnet-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    context_window: 200000
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  # Local models (Ollama, vLLM) usually need no key.
  - name: local
    provider: openai_compatible
    model: llama3.2
    base_url: http://localhost:11434/v1
    context_window: 8192

# When every retry on a model has failed, try these next (transitively, each model once).
fallbacks:
  fast: [smart]
