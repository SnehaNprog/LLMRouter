# Copy to config.yaml. API keys are never written here; reference environment variables instead.
models:
  # Several entries with the same name form one alias; traffic is split by weight.
  - name: fast
    tier: slm  # slm / mid / frontier: how capable (and costly) the model is
    provider: openai_compatible
    model: llama-3.1-8b-instant
    base_url: https://api.groq.com/openai/v1
    api_key: os.environ/GROQ_API_KEY
    weight: 1
    rpm: 30
    context_window: 131072  # tokens; take this from the model's docs
    # USD per million tokens. Illustrative numbers: use your vendor's current price list.
    input_cost_per_mtok: 0.05
    output_cost_per_mtok: 0.08

  - name: balanced
    tier: mid
    provider: openai_compatible
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key: os.environ/GROQ_API_KEY
    context_window: 131072
    input_cost_per_mtok: 0.59
    output_cost_per_mtok: 0.79

  - name: smart
    tier: frontier
    provider: anthropic
    model: claude-sonnet-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    context_window: 200000
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  # Local models (Ollama, vLLM) usually need no key.
  - name: local
    tier: slm
    provider: openai_compatible
    model: llama3.2
    base_url: http://localhost:11434/v1
    context_window: 8192

# When every retry on a model has failed, try these next (transitively, each model once).
fallbacks:
  fast: [smart]

# Optional: tune how request complexity is judged for smart routing (see app/routing/score.py).
# Each number says how strongly a signal argues that a request is hard, from 0 (ignore it) to 1;
# signals you leave out keep their defaults. small_talk_factor scales down greetings and thanks.
# routing:
#   complexity:
#     reasoning: 0.6
#     code: 0.5
#     small_talk_factor: 0.2
#   # The highest complexity (0 to 1) each tier is trusted with. Above mid, only a frontier model.
#   tier_ceilings:
#     slm: 0.30
#     mid: 0.60
#   # Among models that are strong enough, how much price matters against speed.
#   objective:
#     cost: 0.8
#     latency: 0.2
#   expected_completion_tokens: 400  # assumed answer length when a request sets no max_tokens
#   latency_scale_seconds: 2  # slowness counts for half its weight at this many seconds
